name: fresh-venv-smoke

# Smoke-test the fresh-venv install path for each lightweight bundled
# model. Catches the failure mode where a script's pip_extras misses a
# transitive dep that from_pretrained pulls in at load time. See
# docs/superpowers/specs/2026-04-30-fresh-venv-smoke-test-design.md.
#
# All matrix.model values are author-controlled (the list below), so
# there is no injection vector from issue/PR titles or commits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - kokoro-82m
          - dinov2-small
          - bart-large-cnn
          - bge-reranker-v2-m3
          - mert-v1-95m
          - supertonic-3
          - twitter-roberta-base-sentiment-latest
          - deberta-v3-base-zeroshot-v2.0
          - trocr-base-printed
          - depth-anything-v2-small
          - vitpose-base-simple
          - detr-resnet-50
          - ast-audioset
          # Resolver curations below run a real 1-second inference probe so
          # TorchCodec/FFmpeg decoding is tested, not merely model imports.
          - utmos
          - audiobox-aesthetics
          - smolvlm-256m-instruct
          # opus-mt-en-es (~300MB, fixed en->es pair) is the lightweight
          # text/translation smoke candidate. The bundled default,
          # m2m100-418m (~2GB), exceeds the "lightweight" guidance for
          # this free-tier matrix and is deliberately excluded; it is
          # covered instead by the mocked model tests + the opt-in
          # tests/integration/test_remote_translation.py suite.
          - opus-mt-en-es

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('pyproject.toml') }}-${{ matrix.model }}
          restore-keys: |
            ${{ runner.os }}-hf-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-hf-

      - name: install host muse
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          # The outer harness executes `muse pull`, whose bundled-model
          # discovery imports modality protocols backed by FastAPI. Keep
          # model ML dependencies isolated to the fresh venv below, but give
          # the harness Muse's server runtime contract.
          pip install -e ".[dev,server]"

      - name: system deps for kokoro
        if: matrix.model == 'kokoro-82m'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: system deps for audio quality
        if: matrix.model == 'utmos' || matrix.model == 'audiobox-aesthetics'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: smoke-test fresh venv
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          MODEL_ID: ${{ matrix.model }}
          VENV_ROOT: ${{ runner.temp }}/muse-smoke-${{ matrix.model }}
        run: |
          set -o pipefail
          mkdir -p "$VENV_ROOT"
          python scripts/smoke_fresh_venv.py \
            --model_id "$MODEL_ID" \
            --venv_root "$VENV_ROOT" \
            --json | tee smoke-result.json

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.model }}-logs
          path: |
            smoke-result.json
          if-no-files-found: ignore
