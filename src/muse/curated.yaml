# ===== 3D generation =====
#
# v0.41.0 ships TripoSR as the bundled image-to-3d default. Curated
# entries below cover larger / dual-direction models. Note: the v0.41.0
# HF resolver routes ALL 3D-tagged repos through TripoSRRuntime; the
# entries below carry hf_repo + capability flags but their dedicated
# runtime classes (TRELLIS, Hunyuan3D-2, etc.) ship in v0.41.x. Pulling
# any of these today downloads the weights and registers a placeholder
# runtime; calling /v1/3d/* against them will route through TripoSRRuntime
# which may or may not work depending on the repo's safetensors layout.
# This is a deliberate trade-off: ship the protocol + a working bundled
# default in v0.41.0, fill in dedicated runtimes incrementally.

# TRELLIS large: image-only, ~1.5GB at fp16, requires trust_remote_code.
# Microsoft Research's 2024 release. JeffreyXiang's mirror is the
# community-maintained drop-in.
- id: trellis-image
  uri: hf://JeffreyXiang/TRELLIS-image-large
  modality: 3d/generation
  size_gb: 1.5
  description: "TRELLIS image-to-3D: ~1.5GB at fp16, MIT, requires trust_remote_code"
  capabilities:
    memory_gb: 6.0
    device: cuda
    supports_image_to_3d: true
    supports_text_to_3d: false
    output_format: glb
    trust_remote_code: true

# Wonder3D: multi-view diffusion. Image-only.
- id: wonder3d-base
  uri: hf://flamehaze1115/wonder3d-v1.0
  modality: 3d/generation
  size_gb: 3.0
  description: "Wonder3D: multi-view diffusion-based image-to-3D, ~3GB, CC-BY-NC-4.0 (non-commercial) (deferred indefinitely; multi-view + NeuS reconstruction does not fit muse's runtime model)"
  capabilities:
    memory_gb: 8.0
    device: cuda
    supports_image_to_3d: true
    supports_text_to_3d: false
    output_format: glb

# Hunyuan3D-2: Tencent's 2024 release, dual-direction.
- id: hunyuan3d-2
  uri: hf://tencent/Hunyuan3D-2
